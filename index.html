<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIVE20 Game</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07130f;
      color: white;
    }

    header {
      background: #0d241b;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #28533f;
    }

    .logo {
      color: #ffb300;
      font-size: 32px;
      font-weight: bold;
    }

    .container {
      width: 92%;
      max-width: 480px;
      margin: 20px auto;
    }

    .card {
      background: #0d241b;
      border: 1px solid #28533f;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      text-align: center;
    }

    .points {
      color: #ffb300;
      font-size: 30px;
      font-weight: bold;
    }

    .wheel {
      width: 230px;
      height: 230px;
      border-radius: 50%;
      margin: 20px auto;
      border: 8px solid #ffb300;

      background: conic-gradient(
        #e74c3c 0deg 60deg,
        #3498db 60deg 120deg,
        #2ecc71 120deg 180deg,
        #9b59b6 180deg 240deg,
        #f1c40f 240deg 300deg,
        #e67e22 300deg 360deg
      );

      transition: transform 3s ease-out;
    }

    .pointer {
      font-size: 30px;
      color: #ffb300;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #ffb300;
      color: #111;
      font-size: 17px;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.5;
    }

    #result {
      margin-top: 15px;
      min-height: 25px;
      color: #ffcc66;
      font-size: 18px;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">LIVE20</div>
  <p>Free Virtual Points Game</p>
</header>

<div class="container">

  <div class="card">
    <h3>Your Virtual Points</h3>
    <div class="points" id="points">1,000</div>
  </div>

  <div class="card">

    <h2>🎡 Free Lucky Spinner</h2>
    <p>Spin for free and receive a virtual bonus!</p>

    <div class="pointer">▼</div>

    <div class="wheel" id="wheel"></div>

    <button id="spinBtn" onclick="spinWheel()">
      SPIN FREE
    </button>

    <div id="result"></div>

  </div>

</div>

<script>

  let points = 1000;
  let rotation = 0;

  const bonuses = [
    10,
    20,
    50,
    100,
    25,
    75
  ];

  function spinWheel() {

    const button =
      document.getElementById("spinBtn");

    const wheel =
      document.getElementById("wheel");

    const result =
      document.getElementById("result");

    button.disabled = true;

    result.textContent = "Spinning...";

    const extraRotation =
      1440 + Math.floor(Math.random() * 1440);

    rotation += extraRotation;

    wheel.style.transform =
      `rotate(${rotation}deg)`;

    setTimeout(() => {

      const bonusIndex =
        Math.floor(Math.random() * bonuses.length);

      const bonus =
        bonuses[bonusIndex];

      points += bonus;

      document.getElementById("points")
        .textContent =
        points.toLocaleString();

      result.textContent =
        `🎉 You received +${bonus} virtual points!`;

      button.disabled = false;

    }, 3000);
  }

</script>

</body>
</html>
