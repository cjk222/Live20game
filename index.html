<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIVE20 Game</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #07130f;
      color: white;
      min-height: 100vh;
    }

    header {
      background: #0d241b;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #28533f;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
      color: #ffb300;
    }

    .subtitle {
      color: #aab8b2;
      margin-top: 5px;
      font-size: 13px;
    }

    .container {
      width: 92%;
      max-width: 480px;
      margin: 20px auto;
    }

    .card {
      background: #0d241b;
      border: 1px solid #28533f;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }

    h2, h3 {
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 10px;
      border-radius: 9px;
      border: 1px solid #426554;
      background: #07130f;
      color: white;
      outline: none;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #ffb300;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      margin-top: 7px;
    }

    .secondary {
      background: #19382b;
      color: white;
    }

    .points {
      text-align: center;
    }

    .points-number {
      color: #ffb300;
      font-size: 34px;
      font-weight: bold;
    }

    .user {
      color: #aab8b2;
      font-size: 13px;
      word-break: break-all;
    }

    .hidden {
      display: none;
    }

    .message {
      margin-top: 12px;
      color: #ffcc66;
      font-size: 14px;
      text-align: center;
    }

    footer {
      text-align: center;
      color: #71857d;
      font-size: 12px;
      padding: 20px;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">LIVE20</div>
  <div class="subtitle">Free Virtual Points Gaming</div>
</header>

<div class="container">

  <!-- LOGIN / REGISTER -->
  <section class="card" id="authBox">
    <h2>👤 Account</h2>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="registerUser()">REGISTER</button>
    <button class="secondary" onclick="loginUser()">LOGIN</button>

    <div class="message" id="message"></div>
  </section>

  <!-- USER AREA -->
  <section class="card hidden" id="userBox">
    <h3>Welcome 👋</h3>
    <div class="user" id="userEmail"></div>

    <button class="secondary" onclick="logoutUser()">LOGOUT</button>
  </section>

  <!-- POINTS -->
  <section class="card points hidden" id="gameBox">
    <h3>🪙 Virtual Points</h3>
    <div class="points-number" id="points">1,000</div>

    <br>

    <button onclick="playGame()">PLAY GAME</button>
  </section>

  <!-- LEADERBOARD -->
  <section class="card hidden" id="leaderboardBox">
    <h3>🏆 Leaderboard</h3>
    <p>Leaderboard system will be connected to the online database in the next step.</p>
  </section>

</div>

<footer>
  LIVE20 • Virtual Points Only
</footer>

<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBXEz7Z1bau3MRkwdEw97iyI54xsBGoO64",
    authDomain: "live20game.firebaseapp.com",
    projectId: "live20game",
    storageBucket: "live20game.firebasestorage.app",
    messagingSenderId: "611980685453",
    appId: "1:611980685453:web:6a5b1ca8f8585cf98c72c4"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  let points = 1000;

  const email = document.getElementById("email");
  const password = document.getElementById("password");
  const message = document.getElementById("message");

  function showMessage(text) {
    message.textContent = text;
  }

  window.registerUser = async function () {
    try {
      await createUserWithEmailAndPassword(
        auth,
        email.value,
        password.value
      );

      showMessage("Account created successfully!");
    } catch (error) {
      showMessage(error.message);
    }
  };

  window.loginUser = async function () {
    try {
      await signInWithEmailAndPassword(
        auth,
        email.value,
        password.value
      );

      showMessage("Login successful!");
    } catch (error) {
      showMessage(error.message);
    }
  };

  window.logoutUser = async function () {
    await signOut(auth);
  };

  window.playGame = function () {

    const win = Math.random() > 0.5;

    if (win) {
      points += 100;
      alert("You won 100 virtual points!");
    } else {
      points = Math.max(0, points - 50);
      alert("You lost 50 virtual points.");
    }

    document.getElementById("points").textContent =
      points.toLocaleString();
  };

  onAuthStateChanged(auth, (user) => {

    const authBox = document.getElementById("authBox");
    const userBox = document.getElementById("userBox");
    const gameBox = document.getElementById("gameBox");
    const leaderboardBox =
      document.getElementById("leaderboardBox");

    if (user) {

      authBox.classList.add("hidden");
      userBox.classList.remove("hidden");
      gameBox.classList.remove("hidden");
      leaderboardBox.classList.remove("hidden");

      document.getElementById("userEmail").textContent =
        user.email;

    } else {

      authBox.classList.remove("hidden");
      userBox.classList.add("hidden");
      gameBox.classList.add("hidden");
      leaderboardBox.classList.add("hidden");
    }
  });

</script>

</body>
</html>
