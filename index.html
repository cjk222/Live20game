<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIVE20 Game</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #07130f;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 18px;
      text-align: center;
      background: #0d241b;
      border-bottom: 1px solid #1c4b38;
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
      color: #ffb300;
    }

    .subtitle {
      margin-top: 5px;
      color: #a8b8b1;
      font-size: 13px;
    }

    .container {
      width: 92%;
      max-width: 500px;
      margin: 20px auto;
    }

    .points {
      background: #102d22;
      border: 1px solid #286449;
      border-radius: 15px;
      padding: 18px;
      text-align: center;
      margin-bottom: 18px;
    }

    .points small {
      color: #a8b8b1;
    }

    .points h2 {
      margin-top: 7px;
      color: #ffb300;
      font-size: 28px;
    }

    .card {
      background: #0d241b;
      border: 1px solid #1c4b38;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .card h3 {
      margin-bottom: 8px;
    }

    .card p {
      color: #a8b8b1;
      font-size: 14px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 13px;
      background: #ffb300;
      color: #111;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    footer {
      text-align: center;
      color: #71857d;
      font-size: 12px;
      padding: 20px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">LIVE20</div>
    <div class="subtitle">Virtual Points Gaming</div>
  </header>

  <main class="container">

    <section class="points">
      <small>Your Virtual Points</small>
      <h2 id="points">1,000</h2>
    </section>

    <section class="card">
      <h3>🎮 Play Game</h3>
      <p>Play using virtual points. No real money.</p>
      <button onclick="playGame()">PLAY NOW</button>
    </section>

    <section class="card">
      <h3>🏆 Leaderboard</h3>
      <p>See the top players and their scores.</p>
      <button onclick="showLeaderboard()">VIEW LEADERBOARD</button>
    </section>

  </main>

  <footer>
    LIVE20 • Free Virtual Points Game
  </footer>

  <script>
    let points = 1000;

    function playGame() {
      const win = Math.random() > 0.5;

      if (win) {
        points += 100;
        alert("You won 100 points!");
      } else {
        points = Math.max(0, points - 50);
        alert("You lost 50 points.");
      }

      document.getElementById("points").textContent =
        points.toLocaleString();
    }

    function showLeaderboard() {
      alert("Leaderboard will be added in the next step.");
    }
  </script>

</body>
</html>
