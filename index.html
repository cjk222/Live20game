<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LIVE20</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#07130f;
  color:white;
}
header{
  padding:20px;
  text-align:center;
  background:#0d241b;
  border-bottom:1px solid #28533f;
}
.logo{
  color:#ffb300;
  font-size:32px;
  font-weight:bold;
}
.container{
  width:92%;
  max-width:500px;
  margin:20px auto;
}
.card{
  background:#0d241b;
  border:1px solid #28533f;
  border-radius:16px;
  padding:20px;
  margin-bottom:16px;
}
input{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #355d4c;
  border-radius:9px;
  background:#07130f;
  color:white;
}
button{
  width:100%;
  padding:14px;
  margin-top:9px;
  border:0;
  border-radius:10px;
  background:#ffb300;
  color:#111;
  font-size:16px;
  font-weight:bold;
}
.secondary{
  background:#19382b;
  color:white;
}
.hidden{display:none}
.game{
  display:flex;
  align-items:center;
  gap:15px;
  cursor:pointer;
}
.icon{font-size:40px}
.game h3{margin:0 0 5px}
.game p{
  margin:0;
  color:#9fb0a8;
  font-size:13px;
}
.points{
  color:#ffb300;
  font-size:30px;
  font-weight:bold;
  text-align:center;
}
#message{
  min-height:22px;
  color:#ffcc66;
  text-align:center;
  margin:8px;
}
</style>
</head>

<body>

<header>
  <div class="logo">LIVE20</div>
  <div>🎮 Free Arcade Games</div>
</header>

<div class="container">

<!-- LOGIN -->
<div id="authBox" class="card">
  <h2 id="authTitle">Login</h2>

  <input id="email"
         type="email"
         placeholder="Email">

  <input id="password"
         type="password"
         placeholder="Password">

  <button onclick="login()">LOGIN</button>
  <button class="secondary"
          onclick="register()">REGISTER</button>

  <div id="message"></div>
</div>


<!-- HOME -->
<div id="home" class="hidden">

  <div class="card">
    <div>👤 <span id="userEmail"></span></div>
    <div class="points">🪙 1,000</div>
    <button class="secondary"
            onclick="logout()">LOGOUT</button>
  </div>


  <h2>🎮 Choose a Game</h2>


  <div class="card game"
       onclick="alert('🏏 Cricket Hit চালু হবে')">
    <div class="icon">🏏</div>
    <div>
      <h3>Cricket Hit</h3>
      <p>Tap and score runs.</p>
    </div>
  </div>


  <div class="card game"
       onclick="alert('🎯 Target Hit চালু হবে')">
    <div class="icon">🎯</div>
    <div>
      <h3>Target Hit</h3>
      <p>Hit the moving target.</p>
    </div>
  </div>


  <div class="card game"
       onclick="alert('🪙 Coin Catch চালু হবে')">
    <div class="icon">🪙</div>
    <div>
      <h3>Coin Catch</h3>
      <p>Catch the falling coins.</p>
    </div>
  </div>


  <div class="card game"
       onclick="alert('🚗 Road Runner চালু হবে')">
    <div class="icon">🚗</div>
    <div>
      <h3>Road Runner</h3>
      <p>Avoid obstacles.</p>
    </div>
  </div>


  <div class="card game"
       onclick="alert('🧱 Brick Breaker চালু হবে')">
    <div class="icon">🧱</div>
    <div>
      <h3>Brick Breaker</h3>
      <p>Break the blocks.</p>
    </div>
  </div>

</div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


const firebaseConfig = {
  apiKey: "AIzaSyBXEz7Z1bau3MRkwdEw97iyI54xsBGoO64",
  authDomain: "live20game.firebaseapp.com",
  projectId: "live20game",
  storageBucket: "live20game.firebasestorage.app",
  messagingSenderId: "611980685453",
  appId: "1:611980685453:web:6a5b1ca8f8585cf98c72c4"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


window.register = async function(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("message");


  if(!email || !password){

    message.textContent =
      "Email এবং password দাও।";

    return;
  }


  try{

    await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );

    message.textContent =
      "✅ Registration successful!";

  }catch(error){

    message.textContent =
      "❌ " + error.message;

  }

};


window.login = async function(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("message");


  if(!email || !password){

    message.textContent =
      "Email এবং password দাও।";

    return;
  }


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(error){

    message.textContent =
      "❌ Login failed";

  }

};


window.logout = async function(){

  await signOut(auth);

};


onAuthStateChanged(auth, user => {

  const authBox =
    document.getElementById("authBox");

  const home =
    document.getElementById("home");

  if(user){

    authBox.classList.add("hidden");
    home.classList.remove("hidden");

    document.getElementById("userEmail")
      .textContent = user.email;

  }else{

    authBox.classList.remove("hidden");
    home.classList.add("hidden");

  }

});

</script>

</body>
</html>
